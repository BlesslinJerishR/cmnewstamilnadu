# Production stack for one 2 vCPU / 4 GB RAM / 40 GB NVMe VPS.
#
# Only Caddy publishes ports (80/443). PostgreSQL, Redis and OpenSearch live on an internal
# network with no published ports. Memory limits add up to ~3.3 GB, leaving ~700 MB for the
# kernel, Docker and page cache; a 2 GB swap file on the host is strongly recommended.
#
#   service      limit    notes
#   opensearch   1536m    768 MB JVM heap (locked) = half the container; rest is off-heap/mmap
#   postgres      700m    shared_buffers 192 MB
#   worker        448m    Node heap capped at 320 MB
#   api           320m    Node heap capped at 224 MB
#   redis         256m    maxmemory 192 MB, noeviction (required by BullMQ)
#   caddy          64m
#
# Usage (from this directory):  cp .env.production.example .env  &&  edit .env  &&  docker compose up -d --build
name: cmnews

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    depends_on: [api]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    mem_limit: 64m
    logging: *logging

  api:
    build: { context: .., dockerfile: apps/backend/Dockerfile }
    image: cmnews-backend:latest
    restart: unless-stopped
    command: ["node", "--max-old-space-size=224", "dist/main.js"]
    env_file: .env
    environment: &backend_env
      NODE_ENV: production
      DATABASE_URL: postgres://cmnews:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/cmnews
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      OPENSEARCH_URL: http://opensearch:9200
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [edge, internal]
    mem_limit: 320m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  worker:
    image: cmnews-backend:latest
    restart: unless-stopped
    command: ["node", "--max-old-space-size=320", "dist/worker.js"]
    # Lets active jobs finish on shutdown; anything cut off is retried (all jobs are idempotent).
    stop_grace_period: 60s
    env_file: .env
    environment: *backend_env
    depends_on:
      api: { condition: service_started }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      opensearch: { condition: service_started }
    networks: [internal, egress]
    mem_limit: 448m
    cpus: 1.0
    logging: *logging

  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cmnews
      POSTGRES_USER: cmnews
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=192MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=40
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=512MB
      - -c
      - random_page_cost=1.1
      - -c
      - log_min_duration_statement=1000
    volumes: [pgdata:/var/lib/postgresql/data, ./backup:/backup]
    networks: [internal]
    mem_limit: 700m
    shm_size: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmnews -d cmnews"]
      interval: 10s
      retries: 10
    logging: *logging

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      - --maxmemory
      - 192mb
      # BullMQ requires noeviction: evicting a job or lock key would corrupt the queues.
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
    volumes: [redisdata:/data]
    networks: [internal]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    logging: *logging

  opensearch:
    build: ./opensearch
    image: cmnews-opensearch:2.19.6
    restart: unless-stopped
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms768m -Xmx768m"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      # Stop allocating before the small disk is full; the app alerts at 80 % / 90 % itself.
      cluster.routing.allocation.disk.watermark.low: "85%"
      cluster.routing.allocation.disk.watermark.high: "90%"
      cluster.routing.allocation.disk.watermark.flood_stage: "95%"
      action.auto_create_index: "false"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes: [osdata:/usr/share/opensearch/data]
    networks: [internal]
    mem_limit: 1536m
    logging: *logging

networks:
  edge: {}
  # No route to the internet: databases cannot reach out even if compromised.
  internal: { internal: true }
  # Only the worker talks to GDELT.
  egress: {}

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  redisdata:
  osdata:
